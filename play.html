<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Play · ZZ Games</title>
  <script>document.title = "ZZ Classroom";</script>
  <script type="speculationrules">{"prefetch":[{"where":{"selector_matches":".zz-links a, .m-links a, .zz-panel, .topbar .logo, .m-logo"},"eagerness":"moderate"}]}</script>
  <script src="zz-guard.js?v=202611200"></script>
  <link rel="icon" type="image/svg+xml" href="tab/classroom.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="tab/classroom-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="tab/classroom-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="tab/classroom-192.png">
  <meta name="description" content="Play free browser games on ZZ Games.">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css?v=202611200">
  <link rel="stylesheet" href="zz-fx.css?v=202611197">
</head>
<body class="play-page">
  <header class="topbar">
    <a href="index.html" class="logo"><img src="logo-flat.png?v=2" alt="ZZ Games"></a>
    <span class="fx-pill" aria-hidden="true"></span>
    <nav class="zz-links" aria-label="Main">
      <a href="games.html" class="on" aria-current="page">Games</a>
      <a href="music.html">Music</a>
      <a href="watch.html?type=movie&id=popular">Movies</a>
      <a href="watch.html?type=tv&id=popular">TV</a>
    </nav>
    <h1 id="gameTitle" class="game-title"></h1>
    <div class="actions">
      <button id="reload" class="btn ghost" title="Restart">Restart</button>
      <button id="full" class="btn" title="Fullscreen">Fullscreen</button>
    </div>
  </header>

  <main class="stage-wrap">
    <div class="play-col">
      <div id="versions" class="versions" hidden></div>
      <div id="stage" class="stage">
        <div id="loader" class="loader"><div class="loader-art"></div><div class="spinner"></div><p>Loading game…</p></div>
        <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock allow-downloads allow-orientation-lock allow-presentation allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
      </div>
      <p class="hint">Game not working? <a id="report" href="request.html?type=broken">Report a problem</a></p>
    </div>
  </main>

  <script src="games.js?v=202611202"></script>
  <script src="app.js?v=202611205"></script>
  <script src="zz-fx.js?v=202611198"></script>
</body>
</html>
