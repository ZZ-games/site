<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Play · ZZ Games</title>
  <script>document.title = "ZZ Classroom";</script>
  <link rel="icon" type="image/svg+xml" href="images/tab/classroom.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="images/tab/classroom-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="images/tab/classroom-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/tab/classroom-192.png">
  <meta name="description" content="Play free browser games on ZZ Games.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202611131700">
</head>
<body class="play-page">
  <header class="topbar">
    <a href="index.html" class="logo"><img src="images/logo-flat.png" alt="ZZ Games"></a>
    <h1 id="gameTitle" class="game-title"></h1>
    <div class="actions">
      <button id="reload" class="btn ghost" title="Restart">↻ Restart</button>
      <button id="full" class="btn" title="Fullscreen">⛶ Fullscreen</button>
    </div>
  </header>

  <main class="stage-wrap play-layout">
    <div class="play-col">
      <div id="versions" class="versions" hidden></div>
      <div id="stage" class="stage">
        <div id="loader" class="loader"><div class="spinner"></div><p>Loading game…</p></div>
        <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock allow-downloads allow-orientation-lock allow-presentation" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
      </div>
      <div class="game-bar">
        <div id="gameArt" class="game-art"></div>
        <div class="game-info">
          <div id="gameName" class="game-name"></div>
          <div id="gameCat" class="game-cat"></div>
        </div>
        <div class="game-bar-actions">
          <button id="share" class="btn ghost small" type="button">🔗 Copy link</button>
          <button id="nextRandom" class="btn ghost small" type="button">🎲 Random game</button>
        </div>
      </div>
      <p class="hint">Game not working? <a id="report" href="request.html?type=broken">Report a problem</a></p>
    </div>

    <aside class="more-col">
      <h2>More games</h2>
      <div id="more" class="grid small"></div>
    </aside>
  </main>

  <script src="games.js?v=202611131700"></script>
  <script src="app.js?v=202611131700"></script>
</body>
</html>
