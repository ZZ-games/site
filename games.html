<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games · ZZ Games</title>
  <script>document.title = "ZZ Classroom";</script>
  <script type="speculationrules">{"prefetch":[{"where":{"selector_matches":".zz-links a, .m-links a, .zz-panel, .topbar .logo, .m-logo"},"eagerness":"moderate"}]}</script>
  <script src="zz-guard.js?v=202611200"></script>
  <link rel="icon" type="image/svg+xml" href="tab/classroom.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="tab/classroom-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="tab/classroom-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="tab/classroom-192.png">
  <meta name="description" content="All the games on ZZ Games: racers, shooters, arcade and retro classics, free in your browser.">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css?v=202611200">
  <link rel="stylesheet" href="zz-fx.css?v=202611197">
  <link rel="expect" href="#fxReady" blocking="render">
</head>
<body class="games-page">
  <header class="topbar">
    <a href="index.html" class="logo"><img src="logo-flat.png?v=2" alt="ZZ Games"></a>
    <span class="fx-pill" aria-hidden="true"></span>
    <nav class="zz-links" aria-label="Main">
      <a href="games.html" class="on">Games</a>
      <a href="music.html">Music</a>
      <a href="watch.html?type=movie&id=popular">Movies</a>
      <a href="watch.html?type=tv&id=popular">TV</a>
    </nav>
    <i id="fxReady" hidden></i>
    <a id="requestLink" class="btn ghost hide-sm" href="request.html">Request a game</a>
  </header>

  <main>
    <section id="spotlight" class="spotlight" aria-label="Featured games"></section>

    <div class="games-top">
      <label class="zz-search">
        <span class="sr-only">Search games</span>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search games" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
    </div>

    <section class="games-list">
      <div class="row-head">
        <h2 id="gridTitle">All games</h2>
        <span id="gridCount" class="row-count"></span>
        <a id="musicHint" class="music-hint" href="music.html" hidden></a>
      </div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>
        <p>No games match that search.</p>
        <a class="btn" id="emptyRequest" href="request.html">Request it</a>
      </div>
    </section>
  </main>

  <footer class="foot">ZZ Games · new games added all the time · <a href="request.html">request one</a></footer>

  <script src="games.js?v=202611206"></script>
  <script src="sources.js?v=202611206"></script>
  <script src="app.js?v=202611205"></script>
  <script src="zz-fx.js?v=202611198"></script>
</body>
</html>
