<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZZ-Gamble</title>
  <script>document.title = "ZZ Classroom";</script>
  <script type="speculationrules">{"prefetch":[{"where":{"selector_matches":".zz-links a, .m-links a, .zz-panel, .topbar .logo, .m-logo"},"eagerness":"moderate"}]}</script>
<script src="zz-guard.js?v=202611200"></script>
  <link rel="icon" type="image/svg+xml" href="tab/classroom.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="tab/classroom-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="tab/classroom-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="tab/classroom-192.png">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css?v=202611200">
  <link rel="stylesheet" href="zz-fx.css?v=202611197">
  <link rel="expect" href="#fxReady" blocking="render">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo"><img src="logo-flat.png?v=2" alt="ZZ Games"></a>
    <span class="fx-pill" aria-hidden="true"></span>
    <nav class="zz-links" aria-label="Main">
      <a href="games.html">Games</a>
      <a href="music.html">Music</a>
      <a href="watch.html?type=movie&id=popular" data-ch="movies">Movies</a>
      <a href="watch.html?type=tv&id=popular" data-ch="tv">TV</a>
    </nav>
    <i id="fxReady" hidden></i>
  </header>

  <main>
    <section class="gamble-hero">
      <h1><span class="zz">ZZ</span>-GAMBLE</h1>
    </section>
    <div id="grid" class="grid gamble-grid"></div>
  </main>

  <script>
    const CASINOS = [
      { title: "Phantom Casino", url: "gamble/phantom-casino/", image: "gamble/phantom-casino.jpg" },
      { title: "Z-Bet",          url: "gamble/z-bet/",          image: "gamble/z-bet.jpg" },
      { title: "ZZ Casino",      url: "gamble/zz-casino/",      image: "gamble/zz-casino.jpg" },
      { title: "Avia Masters",   url: "gamble/avia-masters/",   image: "gamble/avia-masters.jpg" },
    ];
    const grid = document.getElementById("grid");
    for (const c of CASINOS) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `play.html?gamble=${encodeURIComponent(c.url)}&title=${encodeURIComponent(c.title)}`;
      a.innerHTML = `<div class="cover" style="background-image:url('${c.image}')"></div>
        <div class="meta"><div class="name"></div><div class="cat">Casino</div></div>`;
      a.querySelector(".name").textContent = c.title;
      grid.appendChild(a);
    }
  </script>
  <script src="zz-fx.js?v=202611198"></script>
</body>
</html>
