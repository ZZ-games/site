<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZZ-Gamble</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="style.css?v=202610200819">
  <style>
    .gamble-hero {
      margin-top: 24px; border-radius: 22px; padding: clamp(28px, 5vw, 56px) 20px; text-align: center;
      background:
        radial-gradient(ellipse 60% 80% at 50% 30%, #3b2a00aa 0%, #01031fdd 70%),
        url("images/hero-bg.jpg") center / cover;
      border: 1px solid #f5c24255; box-shadow: inset 0 0 80px #f5c24222, 0 20px 60px #0007;
    }
    .gamble-hero h1 {
      font-family: "Russo One", sans-serif; font-weight: 400; margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.6rem); letter-spacing: 1px;
      background: linear-gradient(180deg, #ffe08a, #f5a623 60%, #b86b00);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 22px #f5c24266);
    }
    .gamble-hero .zz { background: linear-gradient(180deg, #7fb2ff, #1f6bff); -webkit-background-clip: text; background-clip: text; }
        .gamble-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(16px, 3vw, 32px); margin-top: 32px; }
    .gamble-grid .card { width: clamp(150px, 28vw, 300px); }
    .gamble-grid .name { font-size: 1.05rem; }
    @media (max-width: 640px) {
      .gamble-grid { gap: 12px; }
      .gamble-grid .card { width: calc(50% - 6px); }
      .gamble-grid .name { font-size: .92rem; white-space: normal; }
    }
    .gamble-grid .card:hover { border-color: #f5c242; box-shadow: 0 10px 30px #f5c24233; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo"><img src="images/logo-flat.png" alt="ZZ Games"></a>
    <a href="index.html" class="btn ghost" style="margin-left:auto">← Back to games</a>
  </header>

  <main>
    <section class="gamble-hero">
      <h1><span class="zz">ZZ</span>-GAMBLE</h1>
    </section>
    <div id="grid" class="grid gamble-grid"></div>
  </main>

  <script>
    const CASINOS = [
      { title: "Phantom Casino", url: "gamble/phantom-casino/", image: "images/gamble/phantom-casino.jpg" },
      { title: "Z-Bet",          url: "gamble/z-bet/",          image: "images/gamble/z-bet.jpg" },
      { title: "ZZ Casino",      url: "gamble/zz-casino/",      image: "images/gamble/zz-casino.jpg" },
      { title: "Avia Masters",   url: "gamble/avia-masters/",   image: "images/gamble/avia-masters.jpg" },
    ];
    const grid = document.getElementById("grid");
    for (const c of CASINOS) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `play.html?gamble=${encodeURIComponent(c.url)}&title=${encodeURIComponent(c.title)}`;
      a.innerHTML = `<div class="cover" style="background-image:url('${c.image}')"></div>
        <div class="meta"><div class="name"></div><div class="cat">Casino</div></div>`;
      a.querySelector(".name").textContent = c.title;
      grid.appendChild(a);
    }
  </script>
</body>
</html>
