  <style>
    /* Site shell: while a song is loaded, other pages open here so the music keeps playing */
    #gameShell { position: fixed; inset: 0; z-index: 41; background: #00030f; }
    /* on other pages the player lives in the nav's "now playing" dropdown, so the bottom bar steps aside */
    body.games-overlay #bar { display: none !important; }
    #gameFrame { display: block; width: 100%; height: 100%; border: 0; background: #00030f; }
    body.games-overlay { overflow: hidden; padding-top: 0 !important; }
    body.games-overlay > .m-top, body.games-overlay > .m-note, body.games-overlay > .m-main, body.games-overlay > .fx-bg { visibility: hidden; pointer-events: none; }
  </style>
  <script src="music/music.js?v=202611204"></script>
  <script>
    (() => {
      const shell = document.getElementById('gameShell');
      const frame = document.getElementById('gameFrame');
      const PAGES = ['index.html', 'games.html', 'play.html', 'watch.html', 'request.html', 'gamble.html'];
      const music = () => window.ZZMusic;
      const fileOf = (u) => u.pathname.split('/').pop() || 'index.html';
      const sitePage = (href) => {
        try {
          const u = new URL(href, location.href);
          return u.origin === location.origin && PAGES.includes(fileOf(u)) ? u : null;
        } catch { return null; }
      };
      const rel = (u) => fileOf(u) + u.search + u.hash;
      let active = false;

      // History: opening / closing the shell adds one entry; pages navigating inside it add their
      // own entries (the browser does that), and the address bar just follows along.
      const go = (href) => { try { frame.contentWindow.location.replace(href); } catch { frame.src = href; } };
      // Switching between the Music page and another page cross-fades, like a normal tab switch.
      // Opening a page waits (briefly) for it to load, so you never see an empty frame.
      const calm = () => document.documentElement.classList.contains('reduce-motion');
      const smooth = (fn) => {
        if (!document.startViewTransition || calm()) { fn(); return null; }
        const vt = document.startViewTransition(fn);
        // a crossfade cut short (e.g. leaving the page mid-switch) is fine: don't report it as an error
        [vt.ready, vt.finished, vt.updateCallbackDone].forEach((p) => p.catch(() => {}));
        return vt;
      };
      const loaded = () => new Promise((res) => {
        const t = setTimeout(res, 1200);
        frame.addEventListener('load', () => { clearTimeout(t); setTimeout(res, 60); }, { once: true });
      });
      function showView(u, push = true) {
        const url = 'music.html?view=' + encodeURIComponent(rel(u));
        if (push) history.pushState({ zzView: rel(u) }, '', url); else history.replaceState({ zzView: rel(u) }, '', url);
        const change = frame.getAttribute('data-src') !== rel(u);
        if (change) { frame.setAttribute('data-src', rel(u)); go(u.href); }
        const reveal = () => { active = true; document.body.classList.add('games-overlay'); shell.hidden = false; };
        if (active || !change) { reveal(); return; }
        active = true;
        smooth(() => loaded().then(reveal));
      }
      function closeView(push = true) {
        if (!active) return;
        active = false;
        if (push) history.pushState({}, '', 'music.html' + location.hash); else history.replaceState({}, '', 'music.html' + location.hash);
        const vt = smooth(() => { document.body.classList.remove('games-overlay'); shell.hidden = true; });
        const blank = () => { if (active) return; frame.removeAttribute('data-src'); go('about:blank'); };   // unless it was reopened meanwhile
        if (vt && vt.finished) vt.finished.then(blank, blank); else blank();
      }

      // Links on the Music page: open site pages in the shell only while music is loaded
      document.addEventListener('click', (e) => {
        const a = e.target.closest('a[href]');
        if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank') return;
        const u = sitePage(a.href);
        if (u && music()?.active()) { e.preventDefault(); showView(u); }
      }, true);

      // Inside the shell: pages navigate on their own; "Music" brings you back here
      frame.addEventListener('load', () => {
        let doc, loc;
        try { doc = frame.contentDocument; loc = frame.contentWindow.location; } catch { return; }
        if (!doc || loc.href === 'about:blank') return;
        const u = new URL(loc.href);
        if (fileOf(u) === 'music.html') { closeView(); return; }
        if (active && frame.getAttribute('data-src') !== rel(u)) {
          frame.setAttribute('data-src', rel(u));
          history.replaceState({ zzView: rel(u) }, '', 'music.html?view=' + encodeURIComponent(rel(u)));
        }
        doc.addEventListener('click', (e) => {
          const a = e.target.closest('a[href]');
          if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          let t; try { t = new URL(a.href, loc.href); } catch { return; }
          if (t.origin === location.origin && fileOf(t) === 'music.html') {
            e.preventDefault();
            if (t.hash && t.hash !== location.hash) history.replaceState(history.state, '', location.pathname + location.search + t.hash);
            closeView();
            dispatchEvent(new HashChangeEvent('hashchange'));
          }
        }, true);
      });

      // Back / forward
      addEventListener('popstate', (e) => {
        const v = e.state && e.state.zzView;
        const u = v && sitePage(v);
        if (u) showView(u, false); else closeView(false);
      });

      // While a song is loaded, tab links open inside this page, so hover-preloading them is wasted work
      addEventListener('zzmusic:track', () => { const sp = document.getElementById('zzSpec'); if (sp) sp.remove(); });

      // Player closed while a page is open: leave the shell and go to that page for real
      addEventListener('zzmusic:closed', () => {
        if (!active) return;
        let href = frame.src;
        try { href = frame.contentWindow.location.href; } catch { /* use src */ }
        location.href = href;
      });

      // Opened as music.html?view=page (a song was started from another page, or a reload)
      const v0 = new URLSearchParams(location.search).get('view');
      const u0 = v0 && sitePage(v0);
      if (u0) {
        if (music()?.active()) showView(u0, false);
        else location.replace(u0.href);   // nothing playing any more (e.g. after a reload): just go to the page
      }
    })();
  </script>
  <script src="zz-fx.js?v=202611198"></script>
