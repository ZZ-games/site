<!doctype html>
<html lang="en">
<head><script src="../../zz-desktop.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contra</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #fff; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #000;
           width: min(100vw, calc(100vh * 256 / 240)); height: min(100vh, calc(100vw * 240 / 256)); }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             background: rgba(0,0,0,.82); cursor: pointer; text-align: center; padding: 16px; box-sizing: border-box; }
  #overlay h1 { margin: 0 0 12px; font-size: clamp(22px, 5vw, 40px); letter-spacing: 2px; }
  #overlay .go { font-size: clamp(14px, 3vw, 20px); padding: 10px 22px; border: 2px solid #fff; border-radius: 6px; margin-bottom: 16px; }
  #overlay table { font-size: clamp(11px, 2.4vw, 14px); border-collapse: collapse; opacity: .9; }
  #overlay td { padding: 2px 10px; text-align: left; }
  #overlay td:first-child { text-align: right; color: #ffd84a; }
  #overlay.hidden { display: none; }
  #msg { margin-top: 10px; color: #ff8080; font-size: 14px; }
  #file { display: none; }
  #pausebadge { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7);
                padding: 4px 12px; border-radius: 4px; font-size: 14px; display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="256" height="240"></canvas>
  <div id="pausebadge">PAUSED — press P</div>
  <div id="overlay">
    <h1>CONTRA</h1>
    <div class="go" id="golabel">Click to play</div>
    <table>
      <tr><td>Move</td><td>Arrow keys or WASD</td></tr>
      <tr><td>Fire</td><td>J or Z</td></tr>
      <tr><td>Jump</td><td>K or X</td></tr>
      <tr><td>Start</td><td>Enter</td></tr>
      <tr><td>Select</td><td>Shift</td></tr>
      <tr><td>Pause</td><td>P</td></tr>
      <tr><td>Fullscreen</td><td>F</td></tr>
    </table>
    <div id="msg"></div>
    <input type="file" id="file" accept=".nes">
  </div>
</div>
<script src="jsnes.min.js"></script>
<script>
(() => {
  const ROM_URL = 'contra.nes';
  const W = 256, H = 240;
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const img = ctx.getImageData(0, 0, W, H);
  const buf = new ArrayBuffer(img.data.length);
  const buf8 = new Uint8ClampedArray(buf);
  const buf32 = new Uint32Array(buf);
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');
  const fileInput = document.getElementById('file');
  const pausebadge = document.getElementById('pausebadge');

  // ---- audio ----
  const AUDIO_BUF = 8192, AUDIO_MASK = AUDIO_BUF - 1;
  const aL = new Float32Array(AUDIO_BUF), aR = new Float32Array(AUDIO_BUF);
  let aWrite = 0, aRead = 0, audioCtx = null;
  const audioAvail = () => (aWrite - aRead) & AUDIO_MASK;

  const nes = new jsnes.NES({
    onFrame(fb) {
      for (let i = 0; i < W * H; i++) buf32[i] = 0xFF000000 | fb[i];
    },
    onAudioSample(l, r) {
      aL[aWrite] = l; aR[aWrite] = r;
      aWrite = (aWrite + 1) & AUDIO_MASK;
    },
    sampleRate: 44100
  });

  function startAudio() {
    if (audioCtx) { audioCtx.resume(); return; }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
      const node = audioCtx.createScriptProcessor(1024, 0, 2);
      node.onaudioprocess = e => {
        const outL = e.outputBuffer.getChannelData(0), outR = e.outputBuffer.getChannelData(1);
        const n = outL.length;
        // keep emulation in step with the audio clock
        while (running && !paused && audioAvail() < n) nes.frame();
        const have = audioAvail();
        for (let i = 0; i < n; i++) {
          if (i < have) { outL[i] = aL[aRead]; outR[i] = aR[aRead]; aRead = (aRead + 1) & AUDIO_MASK; }
          else { outL[i] = outR[i] = 0; }
        }
      };
      node.connect(audioCtx.destination);
    } catch (err) { audioCtx = null; }
  }

  // ---- keyboard ----
  const B = jsnes.Controller;
  const KEYS = {
    ArrowUp: B.BUTTON_UP, KeyW: B.BUTTON_UP,
    ArrowDown: B.BUTTON_DOWN, KeyS: B.BUTTON_DOWN,
    ArrowLeft: B.BUTTON_LEFT, KeyA: B.BUTTON_LEFT,
    ArrowRight: B.BUTTON_RIGHT, KeyD: B.BUTTON_RIGHT,
    KeyJ: B.BUTTON_B, KeyZ: B.BUTTON_B,          // fire
    KeyK: B.BUTTON_A, KeyX: B.BUTTON_A,          // jump
    Enter: B.BUTTON_START, NumpadEnter: B.BUTTON_START,
    ShiftLeft: B.BUTTON_SELECT, ShiftRight: B.BUTTON_SELECT
  };
  window.addEventListener('keydown', e => {
    if (e.code in KEYS) { e.preventDefault(); if (running) nes.buttonDown(1, KEYS[e.code]); return; }
    if (e.code === 'KeyP' && running) { paused = !paused; pausebadge.style.display = paused ? 'block' : 'none'; e.preventDefault(); }
    if (e.code === 'KeyF') { toggleFullscreen(); e.preventDefault(); }
    if (e.code === 'Space') e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    if (e.code in KEYS) { e.preventDefault(); if (running) nes.buttonUp(1, KEYS[e.code]); }
  });
  // release all buttons if the iframe loses focus, so nothing gets stuck
  window.addEventListener('blur', () => {
    if (!running) return;
    for (const b of new Set(Object.values(KEYS))) nes.buttonUp(1, b);
  });

  function toggleFullscreen() {
    const el = document.getElementById('wrap');
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }

  // ---- main loop ----
  let running = false, paused = false, last = 0, acc = 0;
  const FRAME_MS = 1000 / 60;
  function loop(t) {
    requestAnimationFrame(loop);
    if (!running || paused) { last = t; return; }
    if (!audioCtx || audioCtx.state !== 'running') {
      // no audio: drive frames by time
      acc += Math.min(t - last, 100); last = t;
      while (acc >= FRAME_MS) { nes.frame(); acc -= FRAME_MS; }
    }
    img.data.set(buf8);
    ctx.putImageData(img, 0, 0);
  }

  function boot(romBinaryString) {
    nes.loadROM(romBinaryString);
    running = true;
    overlay.classList.add('hidden');
    window.focus();
    requestAnimationFrame(loop);
  }

  function toBinaryString(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return s;
  }

  let romData = null;
  fetch(ROM_URL).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(ab => { romData = toBinaryString(ab); })
    .catch(() => { document.getElementById('golabel').textContent = 'Click to load a .nes file'; });

  overlay.addEventListener('click', () => {
    if (running) { overlay.classList.add('hidden'); window.focus(); startAudio(); return; }
    if (romData) { startAudio(); boot(romData); }
    else fileInput.click();
  });
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0]; if (!f) return;
    f.arrayBuffer().then(ab => { startAudio(); boot(toBinaryString(ab)); })
      .catch(err => { msg.textContent = 'Could not load that file.'; });
  });
})();
</script>
</body>
</html>
