  -webkit-mask:radial-gradient(circle, transparent 27px, #000 28px);mask:radial-gradient(circle, transparent 27px, #000 28px);}

<script type="text/javascript">
(function(){
"use strict";
/* ---------- device detection ---------- */
var qs = location.search || "";
var forceOn = /[?&]mobile=1/.test(qs), forceOff = /[?&]mobile=0/.test(qs);
var ua = navigator.userAgent || "";
var zzReal = window.__zzReal || {};
var isIPad = zzReal.iPad || /iPad/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
/* ZZ Games: with Desktop mode set to "On" the buttons start hidden (keyboard play), but any touch on
   the game brings them back. In "Auto" they show on iPad. A real keyboard hides them again. */
var zzSetting = "auto"; try{ zzSetting = (JSON.parse(localStorage.getItem("zz-settings")) || {}).desktopMode || "auto"; }catch(e){}
if(zzSetting === "on" && (zzReal.iPad || zzReal.touch)) document.documentElement.classList.add("emc-desktop");
if(zzReal.iPad || zzReal.touch) forceOn = true;
var isPhone = /Android|iPhone|iPod|Mobile|Silk|Kindle/i.test(ua);
var coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
var MOBILE = !forceOff && (forceOn || isIPad || isPhone || (coarse && navigator.maxTouchPoints > 0));
if(!MOBILE) return;
window.eaglerMobileControls = true;

/* ---------- performance: draw at 1x instead of the iPad's 2x screen (4x fewer pixels, much less memory) ---------- */
try{ Object.defineProperty(window, "devicePixelRatio", { configurable:true, get:function(){ return 1; } }); }catch(e){}

/* ---------- focus: inside a site/iframe the iPad can report the game as "not focused", and Minecraft
   then won't let you go back into the game. On touch devices the game always counts as focused. ---------- */
window.addEventListener("blur", function(e){ if(e.target === window) e.stopImmediatePropagation(); }, true);
document.addEventListener("touchstart", function(){
  try{ if(!document.hasFocus()) window.focus(); }catch(e){}
  try{ window.dispatchEvent(new Event("focus")); }catch(e){}
}, { capture:true, passive:true });

/* ---------- lighter graphics on mobile (keeps the game from running out of memory) ---------- */
var tuneTimer = setInterval(function(){
  var gs = null; try{ gs = window.__emcGame && window.__emcGame.gs(); }catch(e){}
  if(!gs) return;
  try{
    if(typeof gs.pg === "number" && gs.pg > 4) gs.pg = 4;   // render distance: max 4 chunks
    if(typeof gs.xf === "number") gs.xf = 0;                  // fast graphics
    if(typeof gs.BB === "number") gs.BB = 0;                  // smooth lighting off
    if(typeof gs.bdU === "number" && gs.bdU < 1) gs.bdU = 1;  // fewer particles
    if(typeof gs.w7 === "number") gs.w7 = 0;                  // dynamic lights off
    if(typeof gs.Aq === "number") gs.Aq = 0;                  // entity shadows off
    if(typeof gs.bGd === "number" && gs.bGd > 100) gs.bGd = 100; // no supersampling
  }catch(e){}
}, 1000);

/* ---------- fake pointer lock (iPad Safari can't lock the pointer) ---------- */
var locked = false, lockEl = null;
function firePLC(){ try{ document.dispatchEvent(new Event("pointerlockchange")); }catch(e){} updateMode(); }
try{
  Object.defineProperty(document, "pointerLockElement", { configurable:true, get:function(){ return locked ? (lockEl || document.body) : null; } });
}catch(e){}
Element.prototype.requestPointerLock = function(){
  lockEl = this;
  if(!locked){ locked = true; setTimeout(firePLC, 0); }
  return Promise.resolve();
};
document.exitPointerLock = function(){ if(locked){ locked = false; firePLC(); } };

/* ---------- audio unlock (iOS only allows it inside a real tap) ---------- */
var audioCtxs = [];
["AudioContext","webkitAudioContext"].forEach(function(n){
  var AC = window[n]; if(!AC) return;
  var W = function(a, b){ var c = arguments.length > 1 ? new AC(a, b) : arguments.length ? new AC(a) : new AC(); audioCtxs.push(c); return c; };
  W.prototype = AC.prototype; try{ Object.setPrototypeOf(W, AC); }catch(e){}
  window[n] = W;
});
function unlockAudio(){
  for(var i = 0; i < audioCtxs.length; i++){
    var c = audioCtxs[i];
    try{
      if(c.state !== "running") c.resume();
      var src = c.createBufferSource(); src.buffer = c.createBuffer(1, 1, 22050); src.connect(c.destination); src.start(0);
    }catch(e){}
  }
}

/* ---------- synthetic input helpers ---------- */
function def(o, k, v){ try{ Object.defineProperty(o, k, { configurable:true, get:function(){ return v; } }); }catch(e){} }
function canvas(){ var c = document.querySelector("#game_frame canvas"); return c || null; }
var KEYNAMES = { 8:"Backspace", 9:"Tab", 13:"Enter", 16:"Shift", 17:"Control", 27:"Escape", 32:" ", 37:"ArrowLeft", 38:"ArrowUp", 39:"ArrowRight", 40:"ArrowDown", 116:"F5" };
function keyName(which){
  if(KEYNAMES[which]) return KEYNAMES[which];
  if((which >= 65 && which <= 90) || (which >= 48 && which <= 57)) return String.fromCharCode(which).toLowerCase();
  return "Unidentified";
}
function keyEv(type, which, key){
  if(!key) key = keyName(which); // the game crashes on an empty key name
  var e = new KeyboardEvent(type, { bubbles:true, cancelable:true, key:key || "", repeat:false });
  def(e, "which", which); def(e, "keyCode", which); def(e, "charCode", type === "keypress" && key && key.length === 1 ? key.charCodeAt(0) : 0);
  window.dispatchEvent(e);
}
var held = {};
function keyDown(code, key){ if(held[code]) return; held[code] = 1; keyEv("keydown", code, key); }
function keyUp(code, key){ if(!held[code]) return; delete held[code]; keyEv("keyup", code, key); }
function tapKey(code, key){ keyEv("keydown", code, key); if(key && key.length === 1) keyEv("keypress", code, key); setTimeout(function(){ keyEv("keyup", code, key); }, 40); }

var lastX = 0, lastY = 0;
function mouseEv(type, x, y, button, mx, my){
  var c = canvas(); if(!c) return;
  var r = c.getBoundingClientRect();
  if(x == null){ x = r.left + r.width/2; y = r.top + r.height/2; }
  lastX = x; lastY = y;
  var e = new MouseEvent(type, { bubbles:true, cancelable:true, view:window, clientX:x, clientY:y, screenX:x, screenY:y, button:button || 0, buttons:(type === "mouseup" ? 0 : 1) });
  def(e, "offsetX", x - r.left); def(e, "offsetY", y - r.top);
  def(e, "movementX", mx || 0); def(e, "movementY", my || 0);
  c.dispatchEvent(e);
}
var mouseHeld = {};
function mDown(b, x, y){ if(mouseHeld[b]) return; mouseHeld[b] = 1; mouseEv("mousedown", x, y, b); }
function mUp(b, x, y){ if(!mouseHeld[b]) return; delete mouseHeld[b]; mouseEv("mouseup", x == null ? lastX : x, y == null ? lastY : y, b); }
function wheel(dy, x, y){
  var c = canvas(); if(!c) return;
  c.dispatchEvent(new WheelEvent("wheel", { bubbles:true, cancelable:true, clientX:x, clientY:y, deltaY:dy, deltaMode:0 }));
}
function releaseAll(){
  for(var k in held) keyUp(+k);
  for(var b in mouseHeld) mUp(+b);
  sneakOn = false; aim = null; aimOwner = null;
  if(ui){ ui.sneak.classList.remove("on"); hideRing(); }
  setDpad(0, 0);
}

/* ---------- key codes ---------- */
var K = { W:87, A:65, S:83, D:68, SPACE:32, SHIFT:16, CTRL:17, E:69, Q:81, T:84, ESC:27, F5:116, ENTER:13, BACK:8, SLASH:191 };
var SYM = { "-":189,"_":189,"=":187,"+":187,"[":219,"{":219,"]":221,"}":221,"\\":220,"|":220,";":186,":":186,"'":222,"\"":222,",":188,"<":188,".":190,">":190,"/":191,"?":191,"`":192,"~":192,
            "!":49,"@":50,"#":51,"$":52,"%":53,"^":54,"&":55,"*":56,"(":57,")":48," ":32 };
function codeForChar(ch){
  var u = ch.toUpperCase();
  if(u >= "A" && u <= "Z" && u.length === 1) return u.charCodeAt(0);
  if(ch >= "0" && ch <= "9") return ch.charCodeAt(0);
  return SYM[ch] || 0;
}

/* ---------- UI ---------- */
var ui = null, sneakOn = false, rclickNext = false, sens = 1.7;
try{ var sv = parseFloat(localStorage.getItem("emc.sens")); if(sv > 0) sens = sv; }catch(e){}

function el(tag, attrs, html, parent){
  var e = document.createElement(tag);
  for(var a in attrs) e.setAttribute(a, attrs[a]);
  if(html != null) e.innerHTML = html;
  if(parent) parent.appendChild(e);
  return e;
}
function build(){
  document.documentElement.classList.add("emc-on");
  var root = el("div", { id:"emc-root" }, null, document.body);
  var game = el("div", { id:"emc-game" }, null, root);
  var gui = el("div", { id:"emc-gui" }, null, root);

  var dpad = el("div", { id:"emc-dpad" }, null, game);
  var du = el("div", { "class":"emc-btn u" }, "&#9650;", dpad);
  var dl = el("div", { "class":"emc-btn l" }, "&#9664;", dpad);
  var dr = el("div", { "class":"emc-btn r" }, "&#9654;", dpad);
  var dd = el("div", { "class":"emc-btn d" }, "&#9660;", dpad);
  var sneak = el("div", { "class":"emc-btn c", "data-act":"sneak" }, "&#8681;", dpad);

  var jump   = el("div", { id:"emc-jump",   "class":"emc-btn emc-r", "data-hold":K.SPACE }, "&#8679;", game);
  var ring = el("div", { id:"emc-ring" }, null, game);
  ring.style.setProperty("--hold", HOLD_MS + "ms");

  var bar = el("div", { "class":"emc-bar" }, null, game);
  el("div", { "class":"emc-btn", "data-tap":K.ESC }, "&#10074;&#10074;", bar);          // pause
  el("div", { "class":"emc-btn", "data-act":"chat" }, "&#128172;", bar);                // chat
  el("div", { "class":"emc-btn", "data-tap":K.E }, "&#127890;", bar);                   // inventory

  var gbar = el("div", { "class":"emc-bar" }, null, gui);
  el("div", { "class":"emc-btn wide", "data-act":"back" }, "&#10005;<small>back</small>", gbar);
  el("div", { "class":"emc-btn wide", "data-act":"kbd" }, "Aa<small>type</small>", gbar);
  var rbtn = el("div", { "class":"emc-btn wide", "data-act":"rclick" }, "R<small>click</small>", gbar);
  el("div", { "class":"emc-btn", "data-act":"fs" }, "&#9974;", gbar);

  var kbd = el("input", { id:"emc-kbd", type:"text", autocomplete:"off", autocorrect:"off", autocapitalize:"off", spellcheck:"false", enterkeyhint:"send" }, null, document.body);
  kbd.value = "  ";

  ui = { root:root, ring:ring, dpad:dpad, du:du, dl:dl, dr:dr, dd:dd, sneak:sneak, rbtn:rbtn, kbd:kbd };
  setupKeyboard(kbd);
  updateMode();
}

var lastMode = "";
function updateMode(){
  if(!ui) return;
  var hasCanvas = !!canvas();
  var mode = !hasCanvas ? "none" : locked ? "game" : "gui";
  if(mode === lastMode) return;
  lastMode = mode;
  ui.root.classList.toggle("ingame", mode === "game");
  ui.root.classList.toggle("ingui", mode === "gui");
  if(locked){ try{ ui.kbd.blur(); }catch(e){} }
  releaseAll();
  for(var id in touches){ var t = touches[id]; if(t.kind === "look" || t.kind === "gui" || t.kind === "dpad") t.kind = "dead"; }
}

/* ---------- D-pad ---------- */
var dpadState = { x:0, y:0 };
function setDpad(x, y){
  if(x === dpadState.x && y === dpadState.y) return;
  dpadState.x = x; dpadState.y = y;
  if(y < 0) keyDown(K.W); else keyUp(K.W);
  if(y > 0) keyDown(K.S); else keyUp(K.S);
  if(x < 0) keyDown(K.A); else keyUp(K.A);
  if(x > 0) keyDown(K.D); else keyUp(K.D);
  if(ui){
    ui.du.classList.toggle("down", y < 0); ui.dd.classList.toggle("down", y > 0);
    ui.dl.classList.toggle("down", x < 0); ui.dr.classList.toggle("down", x > 0);
  }
}
function dpadFromTouch(t){
  var r = ui.dpad.getBoundingClientRect();
  var dx = t.clientX - (r.left + r.width/2), dy = t.clientY - (r.top + r.height/2);
  var dead = r.width * 0.12;
  if(Math.abs(dx) < dead && Math.abs(dy) < dead){ setDpad(0, 0); return; }
  var ang = Math.atan2(dy, dx) * 180 / Math.PI; // 0 = right, 90 = down
  var oct = Math.round(ang / 45); // -4..4
  var map = { "0":[1,0], "1":[1,1], "2":[0,1], "3":[-1,1], "4":[-1,0], "-4":[-1,0], "-3":[-1,-1], "-2":[0,-1], "-1":[1,-1] };
  var m = map[String(oct)]; setDpad(m[0], m[1]);
}

/* ---------- hotbar hit test (assumes GUI Scale = Auto) ---------- */
function hotbarSlot(x, y){
  var c = canvas(); if(!c) return -1;
  var r = c.getBoundingClientRect();
  var W = c.width, H = c.height; if(!W || !H) return -1;
  var px = (x - r.left) * W / r.width, py = (y - r.top) * H / r.height;
  var s = 1; while((W / (s + 1)) >= 320 && (H / (s + 1)) >= 240 && s < 1000) s++;
  var gx = px / s, gy = py / s, sw = W / s, sh = H / s;
  var left = sw / 2 - 91;
  if(gy < sh - 24 || gx < left || gx > left + 182) return -1;
  var slot = Math.floor((gx - left - 1) / 20);
  return Math.max(0, Math.min(8, slot));
}

/* ---------- touch routing ---------- */
var touches = {};
var TAP_MS = 260, HOLD_MS = 380, MOVE_TOL = 12;

function onStart(ev){
  if(!ui) return;
  if(ev.target === ui.kbd) return;
  if(!canvas()) return; // launch countdown screen
  ev.preventDefault();
  for(var i = 0; i < ev.changedTouches.length; i++){
    var t = ev.changedTouches[i];
    var tgt = t.target && t.target.closest ? t.target.closest(".emc-btn,#emc-dpad") : null;
    var rec = { kind:"look", sx:t.clientX, sy:t.clientY, x:t.clientX, y:t.clientY, t0:ev.timeStamp, moved:0, el:tgt };
    touches[t.identifier] = rec;
    if(tgt && tgt.id === "emc-dpad"){
      var dr = ui.dpad.getBoundingClientRect();
      if(Math.abs(t.clientX - (dr.left + dr.width/2)) < dr.width * 0.16 && Math.abs(t.clientY - (dr.top + dr.height/2)) < dr.height * 0.16){
        rec.kind = "btn"; rec.el = ui.sneak; btnDown(ui.sneak, rec); continue; // centre = sneak toggle
      }
      rec.kind = "dpad"; dpadFromTouch(t); continue;
    }
    if(tgt){ rec.kind = "btn"; btnDown(tgt, rec); continue; }
    if(locked){
      var hs = hotbarSlot(t.clientX, t.clientY);
      if(hs >= 0){ rec.kind = "hotbar"; tapKey(49 + hs, String(hs + 1)); continue; }
      rec.kind = "look";
      if(!ringOwner){ ringOwner = rec; setAim(rec, t.clientX, t.clientY); showRing(t.clientX, t.clientY, "charging"); }
      rec.timer = setTimeout(function(r){ return function(){
        if(r.kind === "look" && r.moved < MOVE_TOL && ringOwner === r){
          var u = 0; try{ u = window.__emcGame ? window.__emcGame.use() : 0; }catch(e){}
          r.breaking = true;
          if(u > 0){ r.btn = 2; mDown(2); showRing(r.x, r.y, "using"); }   // eat, drink, block or draw the bow
          else { r.btn = 0; mDown(0); showRing(r.x, r.y, "breaking"); }    // break
        }
      }; }(rec), HOLD_MS);
    }else{
      // GUI / menus: behave like a mouse. Two fingers = scroll.
      var guiCount = 0; for(var id in touches) if(touches[id].kind === "gui") guiCount++;
      if(guiCount >= 1){
        rec.kind = "scroll";
        for(var id2 in touches) if(touches[id2].kind === "gui"){ touches[id2].kind = "dead"; }
      }else{
        rec.kind = "gui";
        rec.btn = rclickNext ? 2 : 0;
        if(rclickNext){ rclickNext = false; ui.rbtn.classList.remove("on"); }
        mouseEv("mousemove", t.clientX, t.clientY, 0, 0, 0);
        mDown(rec.btn, t.clientX, t.clientY);
      }
    }
  }
}
function onMove(ev){
  if(!ui || ev.target === ui.kbd) return;
  ev.preventDefault();
  for(var i = 0; i < ev.changedTouches.length; i++){
    var t = ev.changedTouches[i], rec = touches[t.identifier];
    if(!rec) continue;
    var dx = t.clientX - rec.x, dy = t.clientY - rec.y;
    rec.moved = Math.max(rec.moved, Math.abs(t.clientX - rec.sx) + Math.abs(t.clientY - rec.sy));
    rec.x = t.clientX; rec.y = t.clientY;
    if(rec.kind === "dpad"){ dpadFromTouch(t); }
    else if(rec.kind === "look" && locked){
      if(rec.breaking){
        // keep breaking under the finger while the drag also turns the camera
        mouseEv("mousemove", null, null, 0, dx * sens, dy * sens);
        setAim(rec, t.clientX, t.clientY); moveRing(t.clientX, t.clientY);
      }
      else {
        if(ringOwner === rec && rec.moved >= MOVE_TOL){ hideRing(); clearAim(rec); }
        if(rec.moved >= MOVE_TOL) mouseEv("mousemove", null, null, 0, dx * sens, dy * sens);
      }
    }
    else if(rec.kind === "gui"){ mouseEv("mousemove", t.clientX, t.clientY, 0, dx, dy); }
    else if(rec.kind === "scroll"){
      rec.acc = (rec.acc || 0) + dy;
      while(Math.abs(rec.acc) >= 28){ var s = rec.acc > 0 ? -1 : 1; wheel(s * 100, t.clientX, t.clientY); rec.acc += s * 28; }
    }
  }
}
function onEnd(ev){
  unlockAudio();
  if(!ui || ev.target === ui.kbd) return;
  ev.preventDefault();
  for(var i = 0; i < ev.changedTouches.length; i++){
    var t = ev.changedTouches[i], rec = touches[t.identifier];
    if(!rec) continue;
    delete touches[t.identifier];
    if(rec.timer) clearTimeout(rec.timer);
    var owned = ringOwner === rec;
    if(owned) hideRing();
    if(rec.kind === "dpad"){
      var still = false; for(var id in touches) if(touches[id].kind === "dpad") still = true;
      if(!still) setDpad(0, 0);
    }else if(rec.kind === "btn"){ btnUp(rec.el, rec); }
    else if(rec.kind === "gui"){ mouseEv("mousemove", t.clientX, t.clientY, 0, 0, 0); mUp(rec.btn, t.clientX, t.clientY); }
    else if(rec.kind === "look" && locked){
      if(rec.breaking){ mUp(rec.btn || 0); clearAim(rec); }
      else if(owned && rec.moved < MOVE_TOL){
        // tap: hit a mob if the finger is on one, otherwise place / use
        var hit = window.__emcGame ? window.__emcGame.hit() : -1;
        var btn = hit === 2 ? 0 : 2;
        mDown(btn); setTimeout(function(b){ return function(){ mUp(b); }; }(btn), 60);
        setTimeout(function(r){ return function(){ clearAim(r); }; }(rec), 250);
      } else clearAim(rec);
    }
  }
}

/* ---------- touch aiming: the game's look ray goes through the finger ---------- */
var aim = null, aimOwner = null;
function setAim(owner, x, y){
  var c = canvas(); if(!c) return;
  var r = c.getBoundingClientRect();
  aimOwner = owner;
  aim = { nx: ((x - r.left) / r.width) * 2 - 1, ny: 1 - ((y - r.top) / r.height) * 2, aspect: r.width / r.height };
}
function clearAim(owner){ if(aimOwner === owner){ aim = null; aimOwner = null; } }
var D2R = Math.PI / 180;
window.__emcAimRot = function(pitch, yaw){
  if(!aim) return null;
  var fov = window.__emcGame ? window.__emcGame.fov() : 70;
  var tv = Math.tan(fov * D2R / 2), th = tv * aim.aspect;
  var p = pitch * D2R, y = yaw * D2R;
  var fx = -Math.sin(y) * Math.cos(p), fy = -Math.sin(p), fz = Math.cos(y) * Math.cos(p); // forward
  var rx = -Math.cos(y), ry = 0, rz = -Math.sin(y);                                         // right
  var ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;              // up = right x forward
  var a = aim.nx * th, b = aim.ny * tv;
  var dx = fx + a * rx + b * ux, dy = fy + a * ry + b * uy, dz = fz + a * rz + b * uz;
  var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
  return [ -Math.asin(dy / len) / D2R, Math.atan2(-dx, dz) / D2R ];
};

/* ---------- hold-to-break circle ---------- */
var ringOwner = null;
function moveRing(x, y){ ui.ring.style.left = x + "px"; ui.ring.style.top = y + "px"; }
function showRing(x, y, cls){
  moveRing(x, y);
  ui.ring.className = "";
  void ui.ring.offsetWidth; // restart the fill animation
  ui.ring.className = cls;
}
function hideRing(){ ringOwner = null; if(ui && ui.ring) ui.ring.className = ""; }

/* Close the current menu. In a world this game closes menus with the ` key (Escape only works
   on the title screens), so pick the right one. */
function backKey(){
  var inWorld = false; try{ inWorld = !!(window.__emcGame && window.__emcGame.world()); }catch(e){}
  if(inWorld) tapKey(192, "`"); else tapKey(K.ESC, "Escape");
}

/* ---------- buttons ---------- */
function btnDown(b, rec){
  b.classList.add("down");
  var h = b.getAttribute("data-hold"), m = b.getAttribute("data-mouse"), tp = b.getAttribute("data-tap"), act = b.getAttribute("data-act");
  if(h){ keyDown(+h); }
  else if(m){ mDown(+m); }
  else if(tp){ tapKey(+tp); }
  else if(act === "sneak"){ sneakOn = !sneakOn; b.classList.toggle("on", sneakOn); if(sneakOn) keyDown(K.SHIFT); else keyUp(K.SHIFT); }
  else if(act === "back"){ backKey(); }
  else if(act === "chat"){ tapKey(K.T, "t"); focusKbd(); }
  else if(act === "kbd"){ if(document.activeElement === ui.kbd) ui.kbd.blur(); else focusKbd(); }
  else if(act === "rclick"){ rclickNext = !rclickNext; b.classList.toggle("on", rclickNext); }
  else if(act === "fs"){ toggleFullscreen(); }
}
function btnUp(b, rec){
  b.classList.remove("down");
  var h = b.getAttribute("data-hold"), m = b.getAttribute("data-mouse");
  if(h) keyUp(+h);
  else if(m) mUp(+m);
}
function toggleFullscreen(){
  var d = document, de = d.documentElement;
  var fs = d.fullscreenElement || d.webkitFullscreenElement;
  try{
    if(fs){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
    else { var f = de.requestFullscreen || de.webkitRequestFullscreen; if(f) f.call(de); }
  }catch(e){}
}

/* ---------- on-screen keyboard for chat / world names / commands ---------- */
function focusKbd(){ try{ ui.kbd.value = "  "; ui.kbd.focus({ preventScroll:true }); ui.kbd.setSelectionRange(2, 2); }catch(e){ try{ ui.kbd.focus(); }catch(e2){} } }
function sendChar(ch){
  if(ch === "\n"){ tapKey(K.ENTER, "Enter"); return; }
  var code = codeForChar(ch);
  keyEv("keydown", code, ch); keyEv("keypress", code, ch); keyEv("keyup", code, ch);
}
function setupKeyboard(kbd){
  kbd.addEventListener("keydown", function(e){
    e.stopPropagation(); // don't let the game swallow the real keystroke
    if(e.key === "Enter"){ e.preventDefault(); tapKey(K.ENTER, "Enter"); }
    else if(e.key === "Backspace"){ e.preventDefault(); tapKey(K.BACK, "Backspace"); }
    else if(e.key === "Escape"){ e.preventDefault(); kbd.blur(); backKey(); }
    else if(e.key === "Tab"){ e.preventDefault(); tapKey(9, "Tab"); }
    else if(e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "ArrowLeft" || e.key === "ArrowRight"){
      e.preventDefault(); tapKey({ ArrowLeft:37, ArrowUp:38, ArrowRight:39, ArrowDown:40 }[e.key], e.key);
    }
  });
  kbd.addEventListener("keyup", function(e){ e.stopPropagation(); });
  kbd.addEventListener("keypress", function(e){ e.stopPropagation(); });
  kbd.addEventListener("beforeinput", function(e){
    var t = e.inputType || "";
    e.preventDefault();
    if(t.indexOf("delete") === 0){ tapKey(K.BACK, "Backspace"); }
    else if(t === "insertLineBreak" || t === "insertParagraph"){ tapKey(K.ENTER, "Enter"); }
    else if(e.data){ for(var i = 0; i < e.data.length; i++) sendChar(e.data[i]); }
    kbd.value = "  ";
  });
  // fallback for browsers without beforeinput cancel support
  kbd.addEventListener("input", function(){
    var v = kbd.value;
    if(v.length > 2){ var add = v.slice(2); for(var i = 0; i < add.length; i++) sendChar(add[i]); }
    else if(v.length < 2){ tapKey(K.BACK, "Backspace"); }
    kbd.value = "  ";
  });
}

/* ---------- keyboard vs touch: hide the buttons while a real keyboard is used, bring them back on touch ---------- */
window.addEventListener("keydown", function(e){
  if(e.isTrusted && !(ui && e.target === ui.kbd)) document.documentElement.classList.add("emc-desktop");
}, true);
document.addEventListener("touchstart", function(e){
  if(e.isTrusted) document.documentElement.classList.remove("emc-desktop");
}, { capture:true, passive:true });

/* ---------- wiring ---------- */
document.addEventListener("touchstart", onStart, { passive:false, capture:true });
document.addEventListener("touchmove", onMove, { passive:false, capture:true });
document.addEventListener("touchend", onEnd, { passive:false, capture:true });
document.addEventListener("touchcancel", onEnd, { passive:false, capture:true });
document.addEventListener("gesturestart", function(e){ e.preventDefault(); }, { passive:false });
document.addEventListener("selectstart", function(e){ if(!ui || e.target !== ui.kbd) e.preventDefault(); }, { passive:false });
document.addEventListener("contextmenu", function(e){ e.preventDefault(); }, { passive:false });
document.addEventListener("dblclick", function(e){ e.preventDefault(); }, { passive:false });
window.addEventListener("load", function(){
  build();
  var iv = setInterval(function(){ if(canvas()){ updateMode(); clearInterval(iv); } }, 300);
  window.addEventListener("resize", function(){ setTimeout(updateMode, 50); });
});
window.eaglerMobileDebug = { hotbarSlot:hotbarSlot, isLocked:function(){ return locked; } };
window.eaglerMobileSetSensitivity = function(v){ sens = +v || sens; try{ localStorage.setItem("emc.sens", String(sens)); }catch(e){} };
})();
</script>
