<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Survival Race</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #231F20; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; background: #231F20; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #231F20; z-index: 5; transition: opacity .4s; }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader h1 { margin: 0; font-size: clamp(28px, 6vw, 56px); font-weight: 900; letter-spacing: 1px; text-transform: uppercase; font-style: italic; text-shadow: 0 4px 0 #000; }
  #loader h1 span { color: #ffb400; }
  #bar { width: min(420px, 70vw); height: 14px; border-radius: 8px; background: #3b3536; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.5); }
  #fill { width: 0; height: 100%; background: linear-gradient(90deg, #ff7a00, #ffb400); transition: width .2s; }
  #status { font-size: 14px; opacity: .75; min-height: 1em; text-align: center; padding: 0 20px; }
  #fs { position: fixed; right: 10px; bottom: 10px; z-index: 4; width: 38px; height: 38px; border: 0; border-radius: 8px; background: rgba(0,0,0,.45); color: #fff; font-size: 20px; cursor: pointer; display: none; }
  #fs:hover { background: rgba(0,0,0,.7); }
</style>
</head>
<body>
<canvas id="game" tabindex="-1"></canvas>
<div id="loader">
  <h1>Survival <span>Race</span></h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">Loading...</div>
</div>
<button id="fs" title="Fullscreen" aria-label="Fullscreen">&#x26F6;</button>



<script>
/* ---------- Rebuilt Poki SDK stub (no ads, no network) ---------- */
(function () {
  var param = function (k) { var m = RegExp("[?&]" + k + "=([^&]*)").exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : ""; };
  var ok = function () { return Promise.resolve(); };
  var noop = function () {};
  window.PokiSDK = {
    init: ok, initWithVideoHB: ok,
    commercialBreak: ok,
    rewardedBreak: function () { return Promise.resolve(true); },   // rewards granted instantly
    shareableURL: function () { return Promise.resolve(location.href); },
    getSharableURL: function () { return Promise.resolve(location.href); },
    getURLParam: function (k) { return param("gd" + k) || param(k) || ""; },
    getLanguage: function () { return (navigator.language || "en").split("-")[0]; },
    isAdBlocked: function () { return false; },
    getLeaderboard: ok,
    displayAd: noop, destroyAd: noop, customEvent: noop, logError: noop,
    gameLoadingStart: noop, gameLoadingFinished: noop, gameLoadingProgress: noop,
    gameplayStart: noop, gameplayStop: noop, gameInteractive: noop,
    roundStart: noop, roundEnd: noop, happyTime: noop, setDebug: noop,
    disableProgrammatic: noop, muteAd: noop, setPlayerAge: noop,
    togglePlayerAdvertisingConsent: noop, sendHighscore: noop, setDebugTouchOverlayController: noop
  };

  /* Rebuilt Unity <-> JS bridge (replaces Poki's unity-2020.js loader) */
  window.initPokiBridge = function (obj) {
    if (!window.unityGame) { setTimeout(function () { window.initPokiBridge(obj); }, 100); return; }
    var send = function (m, v) { try { v === undefined ? window.unityGame.SendMessage(obj, m) : window.unityGame.SendMessage(obj, m, v); } catch (e) { console.warn(e); } };
    send("ready");
    window.commercialBreak = function () { send("commercialBreakCompleted"); };
    window.rewardedBreak = function () { send("rewardedBreakCompleted", "true"); };
    window.shareableURL = function () { send("shareableURLResolved", location.href); };
  };
})();

/* Keep keyboard input out of text fields from reaching the game */
(function () {
  var orig = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function (type, fn, opt) {
    if ((type === "keydown" || type === "keyup" || type === "keypress") && (this === document || this === window) && typeof fn === "function") {
      var w = function (ev) { var t = ev.target, tag = (t && t.tagName || "").toUpperCase(); if (t && (t.isContentEditable || tag === "INPUT" || tag === "TEXTAREA")) return; return fn.call(this, ev); };
      return orig.call(this, type, w, opt);
    }
    return orig.call(this, type, fn, opt);
  };
})();

/* ---------- Boot ---------- */
(function () {
  var FILES = {
    loader:    "9853637125e801e9aae48e78dbbdcfca.loader.js",
    framework: "9beb3b25a77830e1a837a1192eaf008f.framework.js.unityweb",
    code:      "2af43bcf95e2c5402294f39cb5883fcb.wasm.unityweb",
    data:      "0efc5f5920e387ddd900893f445adc64.data.unityweb"
  };
  var BUILD_DIR = "game/survival-race-us/Build/";

  var fill = document.getElementById("fill"), status = document.getElementById("status");
  var setP = function (p, msg) { fill.style.width = (p * 100).toFixed(1) + "%"; if (msg) status.textContent = msg; };
  var fail = function (e) { console.error(e); status.textContent = "Couldn't start the game: " + (e && e.message || e); };

  function loadScript(src) {
    return new Promise(function (res, rej) { var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function () { rej(new Error("failed to load " + src)); }; document.body.appendChild(s); });
  }

  /* Embedded mode: files are gzip+base64 inside <script type="application/x-gz-b64"> tags */
  function b64ToBytes(b64) {
    var bin = atob(b64), n = bin.length, out = new Uint8Array(n);
    for (var i = 0; i < n; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function gunzip(bytes) {
    if (typeof DecompressionStream !== "undefined") {
      var ds = new DecompressionStream("gzip");
      return new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer().then(function (b) { return new Uint8Array(b); });
    }
    return new Promise(function (res, rej) {
      if (!window.fflate) return rej(new Error("no gzip decoder available"));
      window.fflate.gunzip(bytes, function (err, out) { err ? rej(err) : res(out); });
    });
  }
  function embedded(key, mime) {
    var el = document.getElementById("gz-" + key);
    var bytes = b64ToBytes(el.textContent.replace(/\s+/g, ""));
    el.textContent = ""; // free memory
    return gunzip(bytes).then(function (raw) { return URL.createObjectURL(new Blob([raw], { type: mime })); });
  }

  var isEmbedded = !!document.getElementById("gz-code");
  var urls;

  var prep;
  if (isEmbedded) {
    setP(0.02, "Unpacking game files...");
    var order = [["loader", "application/javascript"], ["framework", "application/javascript"], ["data", "application/octet-stream"], ["code", "application/wasm"]];
    urls = {};
    prep = order.reduce(function (chain, item, i) {
      return chain.then(function () {
        return embedded(item[0], item[1]).then(function (u) { urls[item[0]] = u; setP(0.02 + 0.18 * (i + 1) / order.length); });
      }).then(function () { return new Promise(function (r) { setTimeout(r, 0); }); });
    }, Promise.resolve());
  } else {
    urls = {}; for (var k in FILES) urls[k] = BUILD_DIR + FILES[k];
    prep = Promise.resolve();
  }

  prep.then(function () {
    setP(isEmbedded ? 0.2 : 0, "Loading engine...");
    return loadScript(urls.loader);
  }).then(function () {
    var canvas = document.getElementById("game");
    var config = {
      dataUrl: urls.data,
      frameworkUrl: urls.framework,
      codeUrl: urls.code,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Brain massage",
      productName: "Survival Race",
      productVersion: "0.0.187",
      cacheControl: function () { return "no-store"; },
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true,
      showBanner: function (msg, type) { if (type === "error") fail(msg); else console.warn(msg); }
    };
    var base = isEmbedded ? 0.2 : 0;
    return createUnityInstance(canvas, config, function (p) {
      setP(base + (1 - base) * p, p >= 1 ? "Starting..." : "Loading " + Math.round(p * 100) + "%");
    });
  }).then(function (inst) {
    window.unityGame = inst;
    var loader = document.getElementById("loader");
    loader.classList.add("hide");
    setTimeout(function () { loader.remove(); }, 500);
    var fs = document.getElementById("fs");
    if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
      fs.style.display = "block";
      fs.onclick = function () { inst.SetFullscreen(1); };
    }
    document.getElementById("game").focus();
  }).catch(fail);

  window.addEventListener("pointerdown", function () { document.getElementById("game").focus(); });
})();
</script>
</body>
</html>
